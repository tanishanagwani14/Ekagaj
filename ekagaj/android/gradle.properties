# Low-RAM Windows: Jetifier (JetifyTransform) uses huge native memory and was crashing the daemon
# (see hs_err: com.android.tools.build.jetifier). Firebase / Flutter plugins use AndroidX — Jetifier off is OK.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=false
org.gradle.workers.max=2
android.useAndroidX=true
android.enableJetifier=false

# Kotlin incremental compile fails on Windows when Pub cache (C:) and project (D:) are on
# different drives ("this and base files have different roots"), crashing the Gradle daemon.
kotlin.incremental=false
# Avoid separate Kotlin compiler daemon (fewer processes / sockets when RAM is tight).
kotlin.compiler.execution.strategy=in-process
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
